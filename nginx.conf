server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    gzip on;
    gzip_vary on;
    gzip_types text/css text/javascript application/javascript application/json application/xml image/svg+xml text/vtt;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location = /inicio.html { return 301 /; }
    location = /blogprincipal.html { return 301 /pages/blog.html; }
    location = /politica-de-privacidad.html { return 301 /pages/politica-de-privacidad.html; }
    location = /blogs/blog-ciberseguridad-mype.html { return 301 /pages/blogs/ciberseguridad-mype.html; }
    location = /blogs/blog-ia-conversacional.html { return 301 /pages/blogs/ia-conversacional.html; }
    location = /blogs/blog-automatizacion-n8n.html { return 301 /pages/blogs/automatizacion-n8n.html; }

    location ~ ^/(?:servicios\.html|pages/servicios(?:\.html|/.*)?)/?$ { return 301 "/#planes"; }
    location ~ ^/pages/casos(?:/.*)?$ { return 301 "/#demo"; }
    location ~ ^/pages/landing-video(?:/|/index\.html)?$ { return 301 "/#demo"; }
    location ~ ^/(?:contacto\.html|pages/contacto\.html|pages/ayuda(?:/.*)?|pages/landing-video/formulario-[1-3]\.html)$ { return 301 "/#contacto"; }
    location ~ ^/gracias(?:/index\.html|/)?$ { return 301 "/#contacto"; }

    location = /config.js {
        expires -1;
        try_files $uri =404;
    }

    location ~* \.vtt$ {
        default_type text/vtt;
        expires 1h;
        try_files $uri =404;
    }

    location ~* \.(?:css|js|svg|png|jpe?g|gif|webp|ico|woff2?|mp4|pdf)$ {
        expires 1h;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
