<script>
        // Micro-interactions for form focus states
        const inputs = document.querySelectorAll('input, select');
        inputs.forEach(input => {
            input.addEventListener('focus', () => {
                input.parentElement.querySelector('label').classList.replace('text-outline-variant', 'text-secondary-container');
            });
            input.addEventListener('blur', () => {
                if (!input.value) {
                    input.parentElement.querySelector('label').classList.replace('text-secondary-container', 'text-outline-variant');
                }
            });
        });
