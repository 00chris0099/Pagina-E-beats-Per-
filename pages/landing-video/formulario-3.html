<script>
        // Micro-interactions and Form Handling
        document.getElementById('final-details-form').addEventListener('submit', function(e) {
            e.preventDefault();
            const btn = e.target.querySelector('button[type="submit"]');
            const originalText = btn.innerHTML;
            
            // Artificial feedback loop
            btn.innerHTML = '<span class="material-symbols-outlined animate-spin" data-icon="sync">sync</span> PROCESANDO...';
            btn.classList.add('opacity-80', 'cursor-not-allowed');
            
            setTimeout(() => {
                btn.innerHTML = '<span class="material-symbols-outlined" data-icon="done_all">done_all</span> SOLICITUD ENVIADA';
                btn.classList.remove('bg-secondary-container');
                btn.classList.add('bg-green-600');
                
                setTimeout(() => {
                    alert('Solicitud enviada correctamente al comando central.');
                    btn.innerHTML = originalText;
                    btn.classList.remove('bg-green-600', 'opacity-80', 'cursor-not-allowed');
                    btn.classList.add('bg-secondary-container');
                }, 1500);
            }, 2000);
        });

        // Hover effects for radio cards
        const radioGroups = document.querySelectorAll('.radio-card');
        radioGroups.forEach(radio => {
            radio.addEventListener('change', (e) => {
                const groupName = e.target.name;
                document.querySelectorAll(`input[name="${groupName}"]`).forEach(input => {
                    input.parentElement.classList.remove('scale-105');
                });
                if(e.target.checked) {
                    e.target.parentElement.classList.add('scale-105');
                }
            });
        });
    </script>
